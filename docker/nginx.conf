# nginx in front of the Laravel API (PHP-FPM in the laravel-api container).
server {
    listen 80;
    root /var/www/public;
    index index.php;
    server_tokens off;

    location / {
        try_files $uri /index.php?$args;
    }

    # Live sales feed (Server-Sent Events): pass straight through without buffering so events
    # arrive as they happen rather than when the stream closes.
    location = /sales-stream {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
