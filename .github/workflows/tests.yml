name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly run catches breakage that no commit here caused, such as a new upstream app image.
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [api, chromium, firefox]
    steps:
      - uses: actions/checkout@v7

      # Same script as a local run, so CI and laptops start and seed the app identically.
      - name: Start Toolshop app
        run: ./scripts/start-app.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        if: matrix.project == 'api'
        run: npm run typecheck

      - name: Install browser
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 7

      - name: Save app logs
        if: failure()
        run: docker compose logs --no-color > app-logs.txt

      - name: Upload app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs-${{ matrix.project }}
          path: app-logs.txt

  pytest:
    name: Pytest (API)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Start Toolshop app
        working-directory: .
        run: ./scripts/start-app.sh

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --junitxml=junit.xml

      - name: Publish results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: python/junit.xml

  report:
    name: Merge Playwright report
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Prepare report for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

  publish-report:
    name: Publish report to GitHub Pages
    needs: report
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.report.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
